<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Portal Login — De-Pythagoras College</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-card__logo">
        <a href="../index.html" class="logo" style="justify-content: center;">
          <div class="logo__mark">DPC</div>
          <div class="logo__text">
            <span class="logo__name">De-Pythagoras</span>
            <span class="logo__tagline">College</span>
          </div>
        </a>
      </div>
      <h1 class="auth-card__title">Sign In</h1>
      <p class="auth-card__subtitle">Student, Parent, Teacher &amp; Admin access</p>

      <div id="login-alert" class="alert alert--info" style="font-size: var(--text-xs);">
        <strong>Demo mode.</strong> Use the credentials listed in the README. This is not a production authentication system.
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">Username / Student ID</label>
          <input type="text" id="username" class="form-input" name="username" required autocomplete="username" autofocus>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" name="password" required autocomplete="current-password">
        </div>
        <div id="login-error" class="form-feedback" aria-live="assertive"></div>
        <button type="submit" class="btn btn--primary" style="width:100%; margin-top: var(--space-2);">Sign In</button>
      </form>

      <p style="text-align: center; margin-top: var(--space-6); font-size: var(--text-sm);">
        <a href="../index.html" style="color: var(--color-primary);">← Back to website</a>
      </p>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/modules/demo-data.js"></script>
  <script src="../js/modules/demo-api.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script>
    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById("login-error");
      errorBox.innerHTML = "";
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      if (!username || !password) {
        errorBox.innerHTML = '<div class="alert alert--error">Please enter username and password.</div>';
        return;
      }

      try {
        const user = await Auth.login(username, password);
        window.location.href = Auth.getRedirectForRole(user.role);
      } catch (err) {
        errorBox.innerHTML = `<div class="alert alert--error">${err.message || "Login failed"}</div>`;
      }
    });

    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
      const user = Auth.getUser();
      window.location.href = Auth.getRedirectForRole(user.role);
    }
  </script>
</body>
</html>
