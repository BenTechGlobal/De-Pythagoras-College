<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Teacher Dashboard — De-Pythagoras College</title>
  <link rel="stylesheet" href="../css/main.css">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar">
      <div class="sidebar__brand">
        <div class="logo__mark" style="width:36px;height:36px;font-size:0.9rem;">H</div>
        <div>
          <div style="font-weight:700;font-size:0.9rem;">DPC Teacher</div>
          <div style="font-size:0.7rem;opacity:0.7;" id="teacher-name">Teacher</div>
        </div>
      </div>
      <nav class="sidebar__nav">
        <a href="teacher-dashboard.html" class="sidebar__link is-active">Dashboard</a>
        <a href="students.html" class="sidebar__link">My Classes</a>
        <a href="attendance.html" class="sidebar__link">Attendance</a>
        <a href="results.html" class="sidebar__link">Score Entry</a>
        <a href="#" class="sidebar__link" id="logout-btn">Sign Out</a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="app-header">
        <strong id="greeting">Teacher Dashboard</strong>
      </header>
      <div class="app-content">
        <div class="alert alert--info">
          Teacher portal (demo). Assigned classes and subjects are shown below. Score entry and attendance marking require backend enforcement of class/subject permissions.
        </div>
        <div class="card">
          <div class="card__header"><h2 class="card__title">My Assignments</h2></div>
          <div class="card__body" id="assignments">Loading...</div>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/modules/demo-data.js"></script>
  <script src="../js/modules/demo-api.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/modules/auth.js"></script>
  <script>
    const user = Auth.requireRole(["teacher", "super_admin", "school_admin"]);
    if (!user) {}
    document.getElementById("teacher-name").textContent = user.name;
    document.getElementById("greeting").textContent = `Welcome, ${user.name}`;
    document.getElementById("logout-btn").addEventListener("click", (e) => { e.preventDefault(); Auth.logout(); });

    const subjects = user.subjects || [];
    const classes = user.classes || [];
    document.getElementById("assignments").innerHTML = `
      <p><strong>Subjects:</strong> ${subjects.join(", ") || "—"}</p>
      <p style="margin-top:0.5rem;"><strong>Classes:</strong> ${classes.join(", ") || "—"}</p>
    `;
  </script>
</body>
</html>
